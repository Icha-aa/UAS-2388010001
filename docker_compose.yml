version: '3.8'

services:
  # Service untuk Aplikasi PHP
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kerudung_app
    restart: always
    volumes:
      - ./dynamic-app:/var/www/html
    environment:
      - DB_HOST=db
      - DB_USER=sitimalikha19
      - DB_PASSWORD=secretpass
      - DB_NAME=kerudung_db
    depends_on:
      - db

  # Service untuk Web Server (Nginx)
  nginx:
    image: nginx:alpine
    container_name: kerudung_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./dynamic-app:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./static-cv:/var/www/static-cv
    depends_on:
      - app

  # Service untuk Database (Ubah ke MySQL agar cocok dengan uas_db.sql)
  db:
    image: mysql:8.0
    container_name: kerudung_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=secretpass
      - MYSQL_USER=sitimalikha19
      - MYSQL_PASSWORD=secretpass
      - MYSQL_DATABASE=kerudung_db
    ports:
      - "3306:3306"
    volumes:
      - ./database/uas_db.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: